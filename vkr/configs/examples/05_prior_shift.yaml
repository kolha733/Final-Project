# Пример 5. Дрейф априорных вероятностей (label shift): P(y) меняется, P(X|y) сохраняется.
schema_version: "1.0"
name: prior_shift_two_steps
tags: [example, prior]
stream:
  n_samples: 20000
  n_features: 5
  minority_share: 0.3
